name: Update matches database

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours à 6h UTC (ajuste si tu veux)
  workflow_dispatch: {} # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write # nécessaire pour que le workflow puisse commit/push

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run update script
        env:
          PANDASCORE_API_KEY: ${{ secrets.PANDASCORE_API_KEY }}
        run: node Backend/scripts/update-matches.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Backend/data/matches.json
          git diff --cached --quiet && echo "Rien à commit." && exit 0
          git commit -m "chore: auto-update matches database"
          git push
