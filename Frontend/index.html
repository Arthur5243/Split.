<!doctype html>
<html lang="fr" style="background:#000">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SPLIT</title>
    <meta name="description" content="Pronostics esports en temps réel. Valorant, CS2, Rocket League." />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Split" />
    <link rel="apple-touch-icon" href="/split-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Preload critique: logos splash + news + rewards banner rendus instantanément -->
    <link rel="preload" as="image" href="/split-header-logo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/split-logo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/news-champions.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/news-marteen.png" />
    <link rel="preload" as="image" href="/news-champions-cs.png" />
    <link rel="preload" as="image" href="/rewards-banner.png" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7218024010278471" crossorigin="anonymous"></script>
    <style>
      html, body, #root { background: #000 !important; margin: 0; padding: 0; height: 100%; touch-action: pan-x pan-y; }
    </style>
    <script>
      (function() {
        var host = location.hostname;
        if (host === 'splitapp.fr' || host === 'www.splitapp.fr') {
          location.replace('https://app.splitapp.fr/download' + location.search + location.hash);
          return;
        }
        var mm = function(q) { return window.matchMedia && window.matchMedia(q).matches; };
        var isStandalone = mm('(display-mode: standalone)') || mm('(display-mode: fullscreen)') || mm('(display-mode: minimal-ui)')
          || window.navigator.standalone === true
          || document.referrer.indexOf('android-app://') === 0;
        var isDev = host === 'localhost' || host === '127.0.0.1';
        if (!isStandalone && !isDev) {
          location.replace('/download');
          return;
        }
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
        document.addEventListener('touchmove', function(e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
      })();
    </script>
  </head>
  <body style="margin:0;padding:0;background:#000;overflow:hidden">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
