<!doctype html>
<html lang="fr" style="background:#000">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SPLIT</title>
    <meta name="description" content="Pronostics esports en temps réel. Valorant, CS2, Rocket League." />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Split" />
    <link rel="apple-touch-icon" href="/split-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html, body, #root { background: #000 !important; margin: 0; padding: 0; height: 100%; }
    </style>
    <script>
      (function() {
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
        var isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        var isInstall = location.search.indexOf('install=1') !== -1;
        if (isStandalone || isDev) {
          // app installed or dev → load normally
        } else if (isInstall) {
          window.__SPLIT_INSTALL_MODE = true;
        } else {
          location.replace('/download');
        }
      })();
    </script>
  </head>
  <body style="margin:0;padding:0;background:#000;overflow:hidden">
    <script>
      if (window.__SPLIT_INSTALL_MODE) {
        document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;gap:20px"><img src="/split-logo.png" alt="Split" style="width:80px;height:80px;object-fit:contain"><div id="installMsg" style="font-size:16px;font-weight:700">Installation en cours...</div><div id="installSpinner" style="width:28px;height:28px;border-radius:50%;border:3px solid #1a1a1a;border-top-color:#C4F000;animation:s .9s linear infinite"></div><style>@keyframes s{to{transform:rotate(360deg)}}</style></div>';
        var done = false;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          done = true;
          e.prompt();
          e.userChoice.then(function(r) {
            if (r.outcome === 'accepted') {
              document.getElementById('installMsg').textContent = 'Installé !';
              document.getElementById('installSpinner').style.display = 'none';
              setTimeout(function() { location.href = '/'; }, 1500);
            } else {
              location.replace('/download');
            }
          });
        });
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js', { scope: '/' });
        }
        setTimeout(function() {
          if (!done) location.replace('/download');
        }, 6000);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
