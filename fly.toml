# fly.toml app configuration file generated for split-01 on 2026-10-15T16:14:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'split-01'
primary_region = 'cdg'

[build]

[env]
  DB_PATH = '/data/matches.db'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'split_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
