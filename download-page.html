<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split — Installe l'app</title>
<meta name="description" content="Pronostics esports en temps réel. Valorant, CS2, Rocket League.">
<meta name="theme-color" content="#C4F000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Inter:wght@400;500&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#050507;
    color:#eaeaea;
    font-family:'Inter',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
    position:relative;
  }

  /* glow */
  body::before{
    content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);
    width:600px;height:600px;
    background:radial-gradient(circle,rgba(196,240,0,.08) 0%,transparent 70%);
    pointer-events:none;
  }

  .card{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
    max-width:380px;width:100%;
  }

  .logo{
    width:68px;height:68px;border-radius:16px;
    background:linear-gradient(135deg,#C4F000,#a0c800);
    display:grid;place-items:center;
    font-family:'Outfit',sans-serif;font-weight:900;font-size:30px;color:#000;
    margin-bottom:24px;
    box-shadow:0 0 50px rgba(196,240,0,.2);
  }

  h1{
    font-family:'Outfit',sans-serif;font-weight:900;
    font-size:28px;line-height:1.15;letter-spacing:-0.02em;
    color:#fff;margin-bottom:8px;
  }
  h1 span{color:#C4F000}

  .sub{
    font-size:14px;color:#777;line-height:1.5;
    margin-bottom:32px;
  }

  .games{
    display:flex;gap:16px;margin-bottom:32px;
  }
  .game{
    display:flex;align-items:center;gap:6px;
    font-family:'Outfit',sans-serif;font-weight:600;font-size:13px;color:#666;
  }
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .dot-v{background:#ff4654}
  .dot-c{background:#f5a623}
  .dot-r{background:#0085ff}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:16px 24px;
    background:#C4F000;color:#000;
    font-family:'Outfit',sans-serif;font-weight:800;font-size:16px;
    border:none;border-radius:50px;cursor:pointer;
    text-decoration:none;
    transition:transform .15s,box-shadow .15s;
    margin-bottom:12px;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(196,240,0,.25)}
  .btn:active{transform:translateY(0)}
  .btn svg{width:20px;height:20px}

  .btn-ghost{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:14px 24px;
    background:transparent;color:#aaa;
    font-family:'Inter',sans-serif;font-weight:500;font-size:13px;
    border:1px solid #1e1e28;border-radius:50px;cursor:pointer;
    text-decoration:none;transition:border-color .2s;
    margin-bottom:24px;
  }
  .btn-ghost:hover{border-color:#C4F000;color:#ccc}

  .hint{
    font-size:11.5px;color:#444;line-height:1.5;
    max-width:300px;
  }
  .hint strong{color:#666}

  .ios-hint{display:none}

  @media(max-width:400px){
    h1{font-size:24px}
    .games{gap:12px}
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">S</div>
  <h1>Pronostics<br><span>esport</span> en direct</h1>
  <p class="sub">Parie sur Valorant, CS2 et Rocket League. Gratuit.</p>

  <div class="games">
    <div class="game"><div class="dot dot-v"></div>Valorant</div>
    <div class="game"><div class="dot dot-c"></div>CS2</div>
    <div class="game"><div class="dot dot-r"></div>RL</div>
  </div>

  <a href="https://frontend-svc-production-3e6d.up.railway.app" class="btn" id="mainBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Installer Split
  </a>

  <a href="https://frontend-svc-production-3e6d.up.railway.app" class="btn-ghost">
    Ouvrir dans le navigateur
  </a>

  <p class="hint android-hint">
    Clique sur <strong>Installer</strong> — la bannière d'installation apparaît automatiquement.
  </p>
  <p class="hint ios-hint">
    Dans Safari, appuie sur <strong>Partager</strong> puis <strong>"Sur l'écran d'accueil"</strong>.
  </p>
</div>

<script>
(function(){
  var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(iOS){
    document.querySelector('.android-hint').style.display = 'none';
    document.querySelector('.ios-hint').style.display = 'block';
  }
})();
</script>

</body>
</html>
